spring:
  application:
    name: hyperliquid-tax-tracker-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hyperliquid_tax_tracker}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

coingecko:
  base-url: ${COINGECKO_BASE_URL:https://api.coingecko.com/api/v3}
  api-key: ${COINGECKO_API_KEY:}
  sol-asset-id: ${COINGECKO_SOL_ASSET_ID:solana}
  usdc-asset-id: ${COINGECKO_USDC_ASSET_ID:usd-coin}
